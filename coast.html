<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Terrarium: the coast</title>
<style>
  html, body { margin: 0; height: 100%; background: #7fbfc8; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; cursor: grab; }
  .hud { position: fixed; left: 14px; bottom: 12px; font: 12px/1.4 ui-monospace, Menlo, monospace; color: #0f3b4a;
    background: rgba(255, 252, 244, .72); padding: 6px 9px; border-radius: 4px; user-select: none; }
  .hud b { font-weight: 600; }
  .hud > div + div { margin-top: 4px; }
  .hud .tip { opacity: .7; margin-left: 6px; }
  #placeStatus { color: #b03a2a; margin-left: 6px; }
  .hud button { font: inherit; margin-left: 4px; border: 1px solid #0f3b4a55; background: #fffaf0; border-radius: 3px; cursor: pointer; padding: 1px 6px; }
  .chip { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); font: 12px ui-monospace, Menlo, monospace; color: #fffaf0; background: #0f3b4acc; padding: 4px 10px; border-radius: 4px; }
  .hud button.on { background: #0f3b4a; color: #fffaf0; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div class="hud"><div><b>The coast</b> &middot; drag or Q / E to turn &middot; wheel to zoom &middot; WASD or arrows to pan (Shift: faster) &middot; Space to tilt &middot; H home</div>
  <div class="light">light: <button data-h="11" class="on">noon</button><button data-h="16.5">afternoon</button><button data-h="18.6">golden</button></div>
  <div class="place">place: <button data-k="townhouse">townhouse</button><button data-k="tower">tower</button><button data-k="pods">pod house</button><button data-k="villa">villa</button>
    <span class="tip">click to place (on a home: stack it) &middot; V another look &middot; R to turn it &middot; right click removes (and all above) &middot; Esc stops</span> <span id="placeStatus"></span></div></div>
<div id="tiltChip" class="chip" hidden>Tilt: drag up and down, Space to go back</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="js/coast.js"></script>
</body>
</html>
