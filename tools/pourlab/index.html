<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Neon Dome pour lab</title>
<style>
  html, body { margin: 0; height: 100%; background: #141a16; overflow: hidden; }
  body { display: grid; place-items: center; touch-action: none; user-select: none; -webkit-user-select: none; }
  /* drawn at 480x270 and scaled up whole pixels at a time, nearest-neighbor, so the pixel art stays crisp */
  #view { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
</style>
</head>
<body>
<canvas id="view" width="480" height="270" aria-label="The Neon Dome bar. Click a bottle to pick it up, hold to pour into the glass."></canvas>
<script type="module" src="pour.js"></script>
</body>
</html>
