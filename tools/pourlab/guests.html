<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Dome guest generator</title>
<style>
  :root { --ink: #F2E4C8; --dim: #9FB3A8; --line: #2E3A34; --panel: #1B221E; --accent: #FF5FB4; --cyan: #5FF3E8; }
  html, body { margin: 0; background: #141A16; color: var(--ink); font: 15px/1.45 ui-monospace, "SF Mono", Menlo, monospace; }
  ::selection { background: var(--accent); color: #141A16; }
  header { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; padding: 14px 20px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: #141A16; z-index: 1; }
  h1 { font-size: 16px; margin: 0 12px 0 0; letter-spacing: 0.02em; color: var(--cyan); }
  label { color: var(--dim); display: flex; gap: 6px; align-items: center; }
  select, button { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid #3A4A42; border-radius: 4px; padding: 5px 10px; }
  button { cursor: pointer; }
  button:hover, select:hover { border-color: var(--cyan); }
  button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  main { padding: 18px 20px 40px; }
  section { margin-bottom: 26px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--dim); margin: 0 0 8px; font-weight: 600; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; }
  figure { margin: 0; background: linear-gradient(#9DB8DC, #C9D7E8 70%, #5A3424 70%); border: 1px solid var(--line); }
  figure canvas { display: block; image-rendering: pixelated; }
  figcaption { background: var(--panel); color: var(--dim); font-size: 12px; padding: 3px 6px; }
  p.note { color: var(--dim); max-width: 72ch; margin: 0 0 18px; }
</style>
</head>
<body>
<header>
  <h1>Guest generator</h1>
  <label>Crowd <select id="crowd"><option value="all">All four</option><option>industrial</option><option>residential</option><option>commercial</option><option>luxury</option></select></label>
  <label>Show <select id="mode"><option value="play">The drink, animated</option><option value="frames">Every frame</option><option value="idle">Waiting only</option></select></label>
  <label>Reaction <select id="tier"><option>Great</option><option>Good</option><option>Meh</option><option>Bad</option></select></label>
  <label>Size <select id="zoom"><option value="2">2x</option><option value="3" selected>3x</option><option value="4">4x</option></select></label>
  <button id="roll">Roll new guests</button>
  <button id="save">Save sheet as PNG</button>
</header>
<main>
  <p class="note">Every guest is drawn in code from a seed (guestgen.js): the same seed always gives the same person. Each crowd dresses and reacts in its own way. Roll for new faces, pick a reaction to see how each crowd takes a Great or a Bad drink.</p>
  <div id="out"></div>
</main>
<script type="module" src="guests.js"></script>
</body>
</html>
