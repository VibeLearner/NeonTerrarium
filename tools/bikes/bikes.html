<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hoverbike sheet</title>
<style>
  body { margin: 0; background: #0b0d12; color: #8fa3b8; font: 11px ui-monospace, Menlo, monospace; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 8px; }
  .cell { background: #232831; border: 1px solid #2f3540; padding: 4px 6px; }
  .cell.pick { border-color: #ff4fd0; box-shadow: 0 0 0 1px #ff4fd0; }
  canvas { image-rendering: pixelated; display: block; }
</style>
</head>
<body>
<div class="grid" id="grid"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="../../js/spritegen.js"></script>
<script src="../../js/artgen.js"></script>
<script src="../../js/artgen_vox.js"></script>
<script>
// A sheet of generated hoverbikes: each cell is one seed, seen from four of the game's eight views, drawn 3x over a street-gray ground.
// ?views=: views round the circle (the game: 32); ?all=1: show them all; ?rowlen=: views a row; ?n=: how many seeds; ?from=: the first; ?seeds=1,2,3: just these; ?s=: scale; ?cols=; ?pick=: the one the game uses, outlined.
const q = new URLSearchParams(location.search), N = +(q.get('n') || 32), FROM = +(q.get('from') || 1), PICK = +(q.get('pick') || 0), S = +(q.get('s') || 3), NV = +(q.get('views') || 8), VIEWS = q.get('all') ? Array.from({ length: NV }, (_, k) => k) : [NV - 1, NV/8, NV/4, NV*3/8];
const SEEDS = q.get('seeds') ? q.get('seeds').split(',').map(Number) : Array.from({ length: N }, (_, i) => FROM + i);
if (q.get('cols')) document.getElementById('grid').style.gridTemplateColumns = 'repeat(' + q.get('cols') + ', 1fr)';
const grid = document.getElementById('grid');
for (const seed of SEEDS){
  const b = ART.bikeGen(seed), vs = ART.bikeViews(b.model, undefined, NV), RL = +(q.get('rowlen') || VIEWS.length);
  const d = document.createElement('div'); d.className = 'cell' + (seed === PICK ? ' pick' : '');
  d.innerHTML = `<div>#${seed} ${b.build} · ${b.livery}${b.panels ? ' + panels' : ''} · ${b.accent} · ${b.glow} glow</div>`;
  for (let r0 = 0; r0 < VIEWS.length; r0 += RL){
    const row = VIEWS.slice(r0, r0 + RL);
    const W = row.reduce((a, k) => a + vs[k].w + 4, 0) * S, Hh = Math.max(...row.map(k => vs[k].h)) * S + 6;
    const cv = document.createElement('canvas'); cv.width = W; cv.height = Hh; const g = cv.getContext('2d'); g.imageSmoothingEnabled = false;
    g.fillStyle = '#3a3f47'; g.fillRect(0, Hh - 10, W, 10);
    let x = 0;
    for (const k of row){ const v = vs[k], off = document.createElement('canvas'); off.width = v.w; off.height = v.h; ART.vox.blit(off.getContext('2d'), v.px, 0, 0);
      g.drawImage(off, x, Hh - 6 - v.h*S, v.w*S, v.h*S); x += (v.w + 4)*S; }
    d.appendChild(cv);
  }
  grid.appendChild(d);
}
document.title = 'ready';
</script>
</body>
</html>
